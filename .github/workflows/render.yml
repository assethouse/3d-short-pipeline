name: Render 3D Test Short

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Blender, FFmpeg, and EGL libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg libegl1 libgl1 libxrender1 libxi6 libxkbcommon0 libsm6 libice6

      - name: Render 3D frames in Blender
        run: blender --background --python scripts/render_scene.py

      - name: Assemble 9x16 video with FFmpeg
        run: python3 scripts/assemble_short.py

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: test-short-1080x1920
          path: output/test_short.mp4
